markdown: |-
    PostgreSQL 19 Beta 3. The World's Most Advanced Open Source Relational Database

    PostgreSQL 19 Beta 3 Release News - https://www.postgresql.org/about/news/postgresql-186-1711-1615-1519-1424-and-19-beta-3-released-3365/

    # Getting Started

    The PostgreSQL 19 Beta 3 Server is already up and running. To connect to
    the server and interact with it using SQL queries, just do the following

    ```bash
    sudo -u postgres psql
    ```

    # Use Cases

    PostgreSQL is The World's Most Advanced Open Source Relational Database.
    You can use it to store relational data. You can also use it to store non
    relational data (NoSQL) with the help of some of it's features and also
    with the help of extensions

    # Why this playground?

    You can use it to quickly spin up an Ubuntu VM with PostgreSQL Server
    installed and up and running and ready to use

    # References
    - https://www.postgresql.org
    - https://www.postgresql.org/about/
    - https://www.postgresql.org/docs/19/index.html
    - https://www.postgresql.org/about/news/postgresql-19-beta-1-released-3313/
    - https://www.postgresql.org/about/news/postgresql-19-beta-2-released-3350/
    - https://www.postgresql.org/about/news/postgresql-186-1711-1615-1519-1424-and-19-beta-3-released-3365/
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: postgres-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/karuppiah7890/iximiuz-labs/playgrounds/postgresql-19:0.0.4
              mount: /
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 4
            ramSize: 10GiB
    tabs:
        - id: terminal-postgres-01
          kind: terminal
          name: postgres-01
          machine: postgres-01
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
