kind: playground
name: postgresql-19-e92a0d56
base: flexbox
title: PostgreSQL 19
description: The World's Most Advanced Open Source Relational Database
cover: /content/files/playgrounds/postgresql-19-e92a0d56/__static__/postgresql.png
categories:
    - linux
    - networking
markdown: |-
    PostgreSQL 19 Beta 2. The World's Most Advanced Open Source Relational Database

    PostgreSQL 19 Beta 2 Release News - https://www.postgresql.org/about/news/postgresql-19-beta-2-released-3350/

    # Getting Started

    The PostgreSQL 19 Beta 2 Server is already up and running. To connect to
    the server and interact with it using SQL queries, just do the following

    ```bash
    psql -U postgres
    ```

    # Use Cases

    PostgreSQL is The World's Most Advanced Open Source Relational Database.
    You can use it to store relational data. You can also use it to store non
    relational data (NoSQL) with the help of some of it's features and also
    with the help of extensions

    # Why this playground?

    You can use it to quickly spin up an Ubuntu VM with PostgreSQL Server
    installed and up and running and ready to use. Apart from that, please
    note that PostgreSQL 19 beta versions are not readily available as
    easily installable packages - for example, you can't do
    `apt install postgresql-19` yet. Until then, this playground will help
    you quickly run PostgreSQL 19 Beta version. We build the PostgreSQL 19
    Beta version from source and provide it as a playground. Once the beta
    releases are over and a stable release comes up, we'll probably update
    the playground to use the standard method of installation - the
    recommended and official method of installation - through official OS
    packages - in this case, `apt` package - Ubuntu (Debian) Package. To
    learn how the PostgreSQL 19 Beta version is built from source code,
    checkout the related GitHub repository powering this playground -
    https://github.com/karuppiah7890/iximiuz-labs-postgresql-19-playground
    and look for the `Dockerfile` which holds the information on how to
    build PostgreSQL 19 Beta version from source and build a container
    image from it. The container image is used as a custom rootfs image
    (VM image) for this playground

    # References
    - https://www.postgresql.org
    - https://www.postgresql.org/about/
    - https://www.postgresql.org/docs/19/index.html
    - https://www.postgresql.org/about/news/postgresql-19-beta-1-released-3313/
    - https://www.postgresql.org/about/news/postgresql-19-beta-2-released-3350/
    - https://www.postgresql.org/about/news/postgresql-186-1711-1615-1519-1424-and-19-beta-3-released-3365/
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: postgres-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/karuppiah7890/iximiuz-labs/playgrounds/postgresql-19:0.0.2
              mount: /
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 4
            ramSize: 10GiB
    tabs:
        - id: terminal-postgres-01
          kind: terminal
          name: postgres-01
          machine: postgres-01
    initTasks:
        init_postgres_01_1:
            name: init_postgres_01_1
            machine: postgres-01
            init: true
            user: root
            timeout_seconds: 300
            run: |-
                #!/bin/bash

                sudo su postgres -c "/usr/local/pgsql/bin/pg_ctl -D /usr/local/pgsql/data initdb"

                sudo mkdir -p /var/log/postgresql

                sudo chown postgres /var/log/postgresql

                sudo su postgres -c "/usr/local/pgsql/bin/pg_ctl -D /usr/local/pgsql/data -l /var/log/postgresql/logfile start"
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
